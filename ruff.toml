# ============================================================
# pup-pack/templates/ruff.toml
# ============================================================
# Updated: 2026-08-21
# WHY: This repo has no pyproject.toml (it is template fragments, not a project).
# Ruff would otherwise use defaults and flag template files whose formatting
# matches the DESTINATION repos' config. Mirror that config here.

[lint] # WHY: Extend Ruff's default rule set as needed.
extend-select = [
    # --- turn on for additional linting rules ---
    "D",  # WHY: Require docstrings; VS Code helps generate them.
]

[lint.isort] # WHY: Sort plain-import and from-import lines together within each section.
force-sort-within-sections = true

[lint.per-file-ignores] # WHY: Some file types need lint exceptions.
"src/**/__init__.py" = ["F401"] # Allow re-export patterns.
"src/**/_version.py" = ["ALL"]  # Auto-generated file; do not lint.
"tests/**/*.py" = ["D", "B018"] # Tests need no docstrings; B018 is default-on.


[lint.pydocstyle] # WHY: Use Google docstring style when D is enabled.
convention = "google"
